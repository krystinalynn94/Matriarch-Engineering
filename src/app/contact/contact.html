<section class="contact-page">

    <header class="contact-header">
        <h2>
            Contact 
            <img src="/ME-only-logo.png" alt="ME">
        </h2>

        <p>
            Have an idea? Let's make it a reality.
        </p>

    </header>


    <div class="contact-scroll">

        <img src="/contact-scroll.png" alt="">

        <div class="decree-header">
            <h3>CONTACT MATRIARCH ENGINEERING</h3>

            <p>
                I welcome inquiries, collaborations, and creative ideas.
                Whether you have a project, a question, or simply wish to connect,
                send your message below and it shall reach me.
            </p>
        </div>

        <form class="contact-form">
            
            <div class="form-row">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Your email"
                    >
                </div>

            </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="What can I help you with?"
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        placeholder="Please give me a brief description of your project..."
                    ></textarea>
            </div>

            <button type="submit" class="send-message-button">
                <img src="/send-message.png" alt="Send Message">
            </button>

        </form>

    </div>

</section>
